services:
  myjwtauthservice:
    image: ${DOCKER_REGISTRY-}myjwtauthservice
    build:
      context: MyJwtAuthService
      dockerfile: Dockerfile
    environment:
    - "ConnectionStrings__AppIdentityDbContext=User Id=${IDENTITY_DB_POSTGRES_USER};Password=${IDENTITY_DB_POSTGRES_PASSWORD};Server=identitydb;Port=5432;Database=${IDENTITY_DB_POSTGRES_NAME}"
    - "ConnectionStrings__Quartz=User Id=${QUARTZ_DB_POSTGRES_USER};Password=${QUARTZ_DB_POSTGRES_PASSWORD};Server=quartz-postgres:5432;Database=${QUARTZ_DB_POSTGRES_NAME}"
    - "Authentication__AccessTokenSecret=${AUTHENTICATION_ACCESSTOKENSECRET}"
    - "Authentication__RefreshTokenSecret=${AUTHENTICATION__REFRESHTOKENSECRET}"
    - "Authentication__AccessTokenExpirationMinutes=30"
    - "Authentication__RefreshTokenExpirationMinutes=43200"
    - "Authentication__Issuer=https://localhost:8081"
    - "Authentication__Audience=https://localhost:8081"

    - "MailSettings__DisplayName=MyJwtAuthService"
    - "MailSettings__From=sergey1pes@gmail.com"
    - MailSettings__Host=papercut
    - "MailSettings__Port=2525"
    - "MailSettings__UserName=user1"
    - "MailSettings__Password=user1"
    - MailSettings__IsAuthenticated=false

    - Cors__AllowedOrigins__0=http://localhost:5173
    - Cors__AllowedOrigins__1=http://localhost:5174

    - "OTEL_EXPORTER_OTLP_ENDPOINT=http://app-dashboard:18889"

    - "RabbitMqOptions__Url=amqp://rabbitmq:5672"
    - "RabbitMqOptions__Username=${RABBITMQ_USER}"
    - "RabbitMqOptions__Password=${RABBITMQ_PASSWORD}"
    depends_on:
      - identitydb
      - papercut
      - quartz-postgres
    ports:
      - 8081:8081

  identitydb:
    container_name: identitydb
    image: postgres:19beta1
    environment:
      POSTGRES_DB: ${IDENTITY_DB_POSTGRES_NAME}
      POSTGRES_USER: ${IDENTITY_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_POSTGRES_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql
  quartz-postgres:
    container_name: quartz-postgres
    image: postgres:19beta1
    environment:
      POSTGRES_DB: ${QUARTZ_DB_POSTGRES_NAME}
      POSTGRES_USER: ${QUARTZ_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${QUARTZ_DB_POSTGRES_PASSWORD}
    volumes:
      - quartz-postgres-data:/var/lib/postgresql
  papercut:
    image: changemakerstudiosus/papercut-smtp:7.7.3-alpha.7
    container_name: papercut_smtp
    ports:
      - "8093:8080"
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:2026-06-18-3
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8082:80"
    restart: always
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - identitydb
  app-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - 18888:18888
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
     # - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  webhooks.processing:
    image: ${DOCKER_REGISTRY-}webhooksprocessing
    build:
      context: .
      dockerfile: Webhooks.Processing/Dockerfile
    environment:
    - "ConnectionStrings__WebhooksDbContext=User Id=${WEBHOOKS_DB_POSTGRES_USER};Password=${WEBHOOKS_DB_POSTGRES_PASSWORD};Server=webhooks-postgres;Port=5432;Database=${WEBHOOKS_DB_POSTGRES_NAME}"

    - Cors__AllowedOrigins__0=http://localhost:5173
    - Cors__AllowedOrigins__1=http://localhost:5174

    - "OTEL_EXPORTER_OTLP_ENDPOINT=http://app-dashboard:18889"

    - "AuthenticationOptions__AccessTokenSecret=${AUTHENTICATION_ACCESSTOKENSECRET}"
    - "AuthenticationOptions__Issuer=https://localhost:8081"
    - "AuthenticationOptions__Audience=https://localhost:8081"

    - "RabbitMqOptions__Url=amqp://rabbitmq:5672"
    - "RabbitMqOptions__Username=${RABBITMQ_USER}"
    - "RabbitMqOptions__Password=${RABBITMQ_PASSWORD}"
    ports:
    - 8084:8081
    depends_on:
      - webhooks-postgres
      - rabbitmq
  webhooks-postgres:
    container_name: webhooks-postgres
    image: postgres:19beta1
    environment:
      POSTGRES-DB: ${WEBHOOKS_DB_POSTGRES_NAME}
      POSTGRES_USER: ${WEBHOOKS_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WEBHOOKS_DB_POSTGRES_PASSWORD}
    volumes:
      - webhooks-postgres-data:/var/lib/postgresql

volumes:
  identity-data:
  quartz-postgres-data:
  pgadmin:
  webhooks-postgres-data:
  rabbitmq_data:


